<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Punto 24</title>
    <link rel="stylesheet" href="../../assets/css/estilos24.css">
</head>
<body>

    <div class="contenedor">
        <h2>¿Cuál es tu lenguaje de programación favorito?</h2>
        
        <div class="opciones">
            <label>
                <input type="radio" name="lenguaje" value="JavaScript"> JavaScript
            </label>
            <br>
            <label>
                <input type="radio" name="lenguaje" value="Python"> Python
            </label>
            <br>
            <label>
                <input type="radio" name="lenguaje" value="C++"> C++
            </label>
        </div>

        <div class="resultado">
            <p>Lenguaje seleccionado: <span id="seleccionado">Ninguno todavía</span></p>
        </div>
    </div>

    <script src="../js/ejercicio24.js"></script>
</body>
